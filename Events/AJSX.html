<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJSX XMLHttpRequest ready State</title>
</head>
<body bgcolor="grey">
    
    <!-- /**
     * =========================================================================
     * DOCUMENTATION: CORE LESSONS LEARNED FROM THIS CODE
     * =========================================================================
     * 
     * 1. ASYNCHRONOUS EXECUTIONS & EVENT LOOP:
     *    - Network requests (like XMLHttpRequest) take time to communicate with servers.
     *    - JavaScript executes code top-to-bottom synchronously without waiting. 
     *    - Because of this, conditional logic depending on network data cannot be run 
     *      globally right after .send(). It must stay inside callbacks (like event 
     *      listeners or state handlers) that check for variables *at a future time*.
     * 
     * 2. XMLHTTPREQUEST (XHR) LIFECYCLE & READYSTATES:
     *    - `xml.open()` sets up the configuration (Method, Target Endpoint).
     *    - `xml.send()` actually fires the request off asynchronously.
     *    - `onreadystatechange` acts as a listener that watches the lifecycle:
     *         0: UNSENT (Created, open not called)
     *         1: OPENED (open called)
     *         2: HEADERS_RECEIVED (send called, headers available)
     *         3: LOADING (Downloading data payload)
     *         4: DONE (Request finished completely)
     *    - Checking `xml.readyState === 4` ensures we only parse data when it is fully ready.
     * 
     * 3. DATA PARSING (JSON):
     *    - API responses arrive as massive strings of pure text (`this.responseText`).
     *    - `JSON.parse()` is mandatory to convert that raw string into a usable 
     *      JavaScript Object (`data`), allowing dot notation like `data.avatar_url`.
     * 
     * 4. DYNAMIC DOM MANIPULATION & INTERACTIVITY:
     *    - `document.querySelector()` targets structural components in the view.
     *    - `addEventListener('click', ...)` binds persistent behavior to UI elements.
     *    - `document.createElement('img')` dynamically builds HTML nodes entirely in memory.
     *    - Setting properties on nodes (like `.src`, `.alt`, `.style`) customizes the element.
     *    - `document.body.appendChild()` pushes the newly generated element live into the active viewport.
     */ -->



    <!-- Value	State	Description
0	UNSENT	Client has been created. open() not called yet.
1	OPENED	open() has been called.
2	HEADERS_RECEIVED	send() has been called, and headers and status are available.
3	LOADING	Downloading; responseText holds partial data.
4	DONE	The operation is complete. -->
    
    <h1>AJSX XMLHttpRequest ready State</h1>
    
    <h2>Asynchonization JavaScript Language</h2>
    <button id="getPhotoURl">Get Photo</button>
    <button id="url">Get URL</button>
</body>
    <script>

        let data;
        const url="https://api.github.com/users/Guru2025-KIT";
        const xmr=new XMLHttpRequest();
        xmr.open('GET',url);
        console.log(xmr.readyState)
        

        xmr.onreadystatechange=function(){
            console.log(xmr.readyState)
            if(xmr.readyState===4){
                data=this.responseText;
                console.log(typeof data)
                data=JSON.parse(xmr.responseText)
                console.log(typeof data)  
            }
        }
        xmr.send();
        

        document.querySelector('#getPhotoURl').addEventListener('click',()=>{

            if(data && data.avatar_url){
                const img=document.createElement('img');
                img.src=data.avatar_url;
                img.alt="Github Profile Photo";
                img.style.width="200px";
                img.style.display="block";
                img.style.marginTop="15px";

                document.body.appendChild(img);
            }else{
                console.log("Data is still loading or unavailable.");
            }
        })


        document.querySelector('#url').addEventListener('click',()=>{
            if(data && data.url){
                const link=document.createElement('a');
                link.href=data.html_url;
                link.textContent="Click Here to Open Github Progfile"
                link.target="_blank";       //Open Link in new Tab
                link.style.width="100px"

                document.body.appendChild(link)
            }else{
                console.log("Data is still loading or unavailable.");

            }
        })

    </script>
</html>
